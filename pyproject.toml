[project]
name = "telegram-secretary"
version = "0.1.0"
description = "MVP personal Telegram secretary with safe calendar auto-reply policy"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.0",
  "python-dotenv>=1.0",
  "telethon>=1.41,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
llm = [
  "openai>=1.0",
]
apple-calendar = [
  "pyobjc-framework-EventKit>=10.0",
]
telegram-user = [
  "telethon>=1.41,<2",
]
voice = [
]
twilio = [
  "twilio>=9.0",
]

[project.scripts]
telegram-secretary = "telegram_secretary.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_secretary"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
